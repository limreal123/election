<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지방선거 여론조사 종합 분석기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- 아이콘 컴포넌트 ---
    const CalculatorIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
    const Settings2Icon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="7" r="3"/><circle cx="8" cy="17" r="3"/></svg>;
    const DownloadIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
    const PlusIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>;
    const TrashIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;

    // 지역별 사전 정의된 가중치
    const REGION_PRESETS = {
      '서울': { dp: 6, ppp: 4 },
      '경기': { dp: 6, ppp: 4 },
      '인천': { dp: 6, ppp: 4 },
      '충남': { dp: 6, ppp: 4 },
      '충북': { dp: 6, ppp: 4 },
      '대전': { dp: 6, ppp: 4 },
      '세종': { dp: 6, ppp: 4 },
      '전북': { dp: 8, ppp: 2 },
      '전남광주': { dp: 8, ppp: 2 },
      '제주': { dp: 7, ppp: 3 },
      '강원': { dp: 5, ppp: 5 },
      '경북': { dp: 3, ppp: 7 },
      '대구': { dp: 3, ppp: 7 },
      '울산': { dp: 4, ppp: 6 },
      '경남': { dp: 4, ppp: 6 },
      '부산': { dp: 4, ppp: 6 },
    };

    const App = () => {
      // 상태 관리
      const [region, setRegion] = useState('서울');
      const [weightDP, setWeightDP] = useState(REGION_PRESETS['서울'].dp);
      const [weightPPP, setWeightPPP] = useState(REGION_PRESETS['서울'].ppp);
      const [isWeightEditable, setIsWeightEditable] = useState(false);
      
      const [polls, setPolls] = useState([
        { id: Date.now(), sampleSize: '', dp: '', ppp: '', reform: '', rebuild: '', other: '' }
      ]);

      // 지역 변경 핸들러
      const handleRegionSelect = (selectedRegion) => {
        setRegion(selectedRegion);
        setWeightDP(REGION_PRESETS[selectedRegion].dp);
        setWeightPPP(REGION_PRESETS[selectedRegion].ppp);
      };

      // 입력 변경 핸들러
      const handleInputChange = (id, field, value) => {
        const regex = /^[0-9]*\.?[0-9]*$/;
        if (value === '' || regex.test(value)) {
          setPolls(polls.map(poll => poll.id === id ? { ...poll, [field]: value } : poll));
        }
      };

      // 가중치 직접 수정 핸들러
      const handleWeightChange = (field, value) => {
        const regex = /^[0-9]*\.?[0-9]*$/;
        if (value === '' || regex.test(value)) {
          if (field === 'dp') setWeightDP(value);
          if (field === 'ppp') setWeightPPP(value);
        }
      };

      // 여론조사 열(Row) 추가 / 삭제
      const addPoll = () => {
        setPolls([...polls, { id: Date.now(), sampleSize: '', dp: '', ppp: '', reform: '', rebuild: '', other: '' }]);
      };

      const removePoll = (id) => {
        if (polls.length > 1) {
          setPolls(polls.filter(poll => poll.id !== id));
        }
      };

      // 데이터 계산 (표본 가중평균 및 최종 보정)
      const results = useMemo(() => {
        let totalSample = 0;
        let sumDP = 0, sumPPP = 0, sumReform = 0, sumRebuild = 0, sumOther = 0;

        // 1. 각 여론조사별 부동층 계산 및 표본크기를 가중치로 한 총합 계산
        const processedPolls = polls.map(poll => {
          const n = parseFloat(poll.sampleSize) || 0;
          const dp = parseFloat(poll.dp) || 0;
          const ppp = parseFloat(poll.ppp) || 0;
          const reform = parseFloat(poll.reform) || 0;
          const rebuild = parseFloat(poll.rebuild) || 0;
          const other = parseFloat(poll.other) || 0;
          
          const sum = dp + ppp + reform + rebuild + other;
          const undecided = sum > 0 ? Math.max(0, 100 - sum) : 0;

          totalSample += n;
          sumDP += dp * n;
          sumPPP += ppp * n;
          sumReform += reform * n;
          sumRebuild += rebuild * n;
          sumOther += other * n;

          return { ...poll, undecided };
        });

        // 2. 표본크기를 반영한 종합 평균 지지율
        const aggDP = totalSample > 0 ? sumDP / totalSample : 0;
        const aggPPP = totalSample > 0 ? sumPPP / totalSample : 0;
        const aggReform = totalSample > 0 ? sumReform / totalSample : 0;
        const aggRebuild = totalSample > 0 ? sumRebuild / totalSample : 0;
        const aggOther = totalSample > 0 ? sumOther / totalSample : 0;
        
        const aggSum = aggDP + aggPPP + aggReform + aggRebuild + aggOther;
        const aggUndecided = aggSum > 0 ? Math.max(0, 100 - aggSum) : 0;

        // 3. 지역 가중치에 따른 최종 부동층 분배
        const wDP = parseFloat(weightDP) || 0;
        const wPPP = parseFloat(weightPPP) || 0;
        const totalW = wDP + wPPP;
        
        const dpRatio = totalW > 0 ? wDP / totalW : 0;
        const pppRatio = totalW > 0 ? wPPP / totalW : 0;

        const finalAdjDP = aggDP + (aggUndecided * dpRatio);
        const finalAdjPPP = aggPPP + (aggUndecided * pppRatio);

        return {
          processedPolls,
          totalSample,
          aggregated: { dp: aggDP, ppp: aggPPP, reform: aggReform, rebuild: aggRebuild, other: aggOther, undecided: aggUndecided },
          final: { dp: finalAdjDP, ppp: finalAdjPPP }
        };
      }, [polls, weightDP, weightPPP]);

      // 엑셀 내보내기
      const exportToCSV = () => {
        let csvContent = "\uFEFF"; // BOM for Korean
        
        // 1. 헤더 (지역 및 가중치)
        csvContent += `분석 지역,${region}\n`;
        csvContent += `적용 가중치 (민:국),${weightDP}:${weightPPP}\n\n`;

        // 2. 개별 데이터
        csvContent += "연번,응답자 수(명),민주당(%),국민의힘(%),개혁신당(%),조국혁신당(%),기타(%),부동층(자동%)\n";
        results.processedPolls.forEach((poll, idx) => {
          csvContent += `${idx + 1},${poll.sampleSize || 0},${poll.dp || 0},${poll.ppp || 0},${poll.reform || 0},${poll.rebuild || 0},${poll.other || 0},${poll.undecided.toFixed(2)}\n`;
        });
        csvContent += "\n";

        // 3. 종합 결과
        csvContent += "종합 분석 (응답자 수 가중평균 반영)\n";
        csvContent += `총 응답자 수,${results.totalSample}명\n`;
        csvContent += `평균 민주당,${results.aggregated.dp.toFixed(2)}%\n`;
        csvContent += `평균 국민의힘,${results.aggregated.ppp.toFixed(2)}%\n`;
        csvContent += `평균 개혁신당,${results.aggregated.reform.toFixed(2)}%\n`;
        csvContent += `평균 조국혁신당,${results.aggregated.rebuild.toFixed(2)}%\n`;
        csvContent += `평균 기타,${results.aggregated.other.toFixed(2)}%\n`;
        csvContent += `평균 부동층,${results.aggregated.undecided.toFixed(2)}%\n\n`;

        // 4. 최종 보정 결과
        csvContent += "최종 보정 결과 (부동층 가중치 배분 완료)\n";
        csvContent += `보정 민주당,${results.final.dp.toFixed(2)}%\n`;
        csvContent += `보정 국민의힘,${results.final.ppp.toFixed(2)}%\n`;

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `${region}_여론조사_종합분석.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // 임의 데이터 채우기 (테스트)
      const fillTestData = () => {
        setPolls([
          { id: Date.now(), sampleSize: '1000', dp: '35.5', ppp: '40.2', reform: '3.1', rebuild: '2.5', other: '1.0' },
          { id: Date.now()+1, sampleSize: '2500', dp: '42.0', ppp: '36.0', reform: '4.0', rebuild: '3.5', other: '0.5' },
          { id: Date.now()+2, sampleSize: '500', dp: '38.0', ppp: '38.0', reform: '2.0', rebuild: '1.0', other: '2.0' }
        ]);
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-6xl mx-auto space-y-6">
            
            {/* 상단 헤더 */}
            <div className="bg-slate-800 text-white p-6 rounded-xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <CalculatorIcon className="w-10 h-10 text-blue-400" />
                <div>
                  <h1 className="text-2xl font-bold">지방선거 여론조사 종합 분석기</h1>
                  <p className="text-sm text-slate-300 mt-1">응답자 수를 반영한 가중평균 후, 지정된 비율로 부동층을 배분합니다.</p>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={fillTestData} className="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded-md text-sm transition">임의 데이터</button>
                <button onClick={() => setPolls([{ id: Date.now(), sampleSize: '', dp: '', ppp: '', reform: '', rebuild: '', other: '' }])} className="px-4 py-2 bg-slate-600 hover:bg-slate-500 rounded-md text-sm transition">초기화</button>
                <button onClick={exportToCSV} className="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-500 rounded-md text-sm font-bold transition"><DownloadIcon className="w-4 h-4"/> CSV 저장</button>
              </div>
            </div>

            {/* Step 1. 지역 및 가중치 선택 */}
            <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200">
              <div className="flex justify-between items-end mb-4">
                <h2 className="text-lg font-bold text-slate-800">1. 분석할 지역 선택</h2>
                
                <div className="flex items-center gap-4">
                  <div className="bg-slate-100 px-4 py-2 rounded-lg flex items-center gap-2 border border-slate-200">
                    <span className="text-sm font-semibold text-slate-600">현재 가중치(민:국) = </span>
                    {isWeightEditable ? (
                      <div className="flex items-center gap-1">
                        <input type="text" value={weightDP} onChange={(e) => handleWeightChange('dp', e.target.value)} className="w-12 p-1 text-center border border-purple-400 rounded focus:outline-none"/>
                        <span>:</span>
                        <input type="text" value={weightPPP} onChange={(e) => handleWeightChange('ppp', e.target.value)} className="w-12 p-1 text-center border border-purple-400 rounded focus:outline-none"/>
                      </div>
                    ) : (
                      <span className="font-bold text-lg text-purple-700">{weightDP} : {weightPPP}</span>
                    )}
                  </div>
                  <button onClick={() => setIsWeightEditable(!isWeightEditable)} className={`flex items-center gap-1 px-3 py-2 rounded text-sm transition ${isWeightEditable ? 'bg-purple-600 text-white' : 'bg-purple-100 text-purple-700 hover:bg-purple-200'}`}>
                    <Settings2Icon className="w-4 h-4" /> {isWeightEditable ? '설정 완료' : '임의 수정'}
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-4 md:grid-cols-8 gap-2">
                {Object.keys(REGION_PRESETS).map((r) => (
                  <button 
                    key={r}
                    onClick={() => handleRegionSelect(r)}
                    className={`py-2 px-1 text-sm font-medium rounded-md border transition-all ${region === r ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'}`}
                  >
                    {r}
                  </button>
                ))}
              </div>
            </div>

            {/* Step 2. 여론조사 데이터 입력 */}
            <div className="bg-white p-6 rounded-xl shadow-md border border-gray-200 overflow-x-auto">
              <div className="flex justify-between items-center mb-4 min-w-[800px]">
                <h2 className="text-lg font-bold text-slate-800">
                  2. <span className="text-blue-600">'{region}'</span> 여론조사 데이터 입력
                </h2>
                <button onClick={addPoll} className="flex items-center gap-2 px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-md text-sm font-bold transition">
                  <PlusIcon className="w-4 h-4" /> 여론조사 행 추가
                </button>
              </div>

              <table className="w-full text-sm text-center border-collapse min-w-[800px]">
                <thead>
                  <tr className="bg-slate-100 text-slate-700 border-b-2 border-slate-300">
                    <th className="p-3 font-semibold w-12">#</th>
                    <th className="p-3 font-semibold text-purple-700 bg-purple-50 w-28 border-r border-slate-200">응답자 수(명)</th>
                    <th className="p-3 font-semibold text-blue-700">민주당(%)</th>
                    <th className="p-3 font-semibold text-red-700">국민의힘(%)</th>
                    <th className="p-3 font-semibold text-orange-600">개혁신당(%)</th>
                    <th className="p-3 font-semibold text-sky-700">조국혁신당(%)</th>
                    <th className="p-3 font-semibold text-gray-600">기타(%)</th>
                    <th className="p-3 font-semibold text-slate-800 bg-yellow-50 border-l border-slate-200">부동층(자동%)</th>
                    <th className="p-3 font-semibold w-12">삭제</th>
                  </tr>
                </thead>
                <tbody>
                  {results.processedPolls.map((poll, index) => (
                    <tr key={poll.id} className="border-b border-slate-200 hover:bg-slate-50">
                      <td className="p-2 font-medium text-slate-500">{index + 1}</td>
                      <td className="p-1 border-r border-slate-200 bg-purple-50/30">
                        <input type="text" value={poll.sampleSize} onChange={(e) => handleInputChange(poll.id, 'sampleSize', e.target.value)} className="w-full p-2 text-center border border-purple-200 rounded focus:ring-2 focus:ring-purple-400 focus:outline-none" placeholder="예: 1000" />
                      </td>
                      <td className="p-1"><input type="text" value={poll.dp} onChange={(e) => handleInputChange(poll.id, 'dp', e.target.value)} className="w-full p-2 text-center border border-slate-200 rounded focus:ring-2 focus:ring-blue-400 focus:outline-none" placeholder="0.0" /></td>
                      <td className="p-1"><input type="text" value={poll.ppp} onChange={(e) => handleInputChange(poll.id, 'ppp', e.target.value)} className="w-full p-2 text-center border border-slate-200 rounded focus:ring-2 focus:ring-red-400 focus:outline-none" placeholder="0.0" /></td>
                      <td className="p-1"><input type="text" value={poll.reform} onChange={(e) => handleInputChange(poll.id, 'reform', e.target.value)} className="w-full p-2 text-center border border-slate-200 rounded focus:ring-2 focus:ring-orange-400 focus:outline-none" placeholder="0.0" /></td>
                      <td className="p-1"><input type="text" value={poll.rebuild} onChange={(e) => handleInputChange(poll.id, 'rebuild', e.target.value)} className="w-full p-2 text-center border border-slate-200 rounded focus:ring-2 focus:ring-sky-400 focus:outline-none" placeholder="0.0" /></td>
                      <td className="p-1"><input type="text" value={poll.other} onChange={(e) => handleInputChange(poll.id, 'other', e.target.value)} className="w-full p-2 text-center border border-slate-200 rounded focus:ring-2 focus:ring-gray-400 focus:outline-none" placeholder="0.0" /></td>
                      <td className="p-2 font-bold text-slate-700 bg-yellow-50/50 border-l border-slate-200">{poll.undecided > 0 ? poll.undecided.toFixed(2) : '-'}</td>
                      <td className="p-2">
                        <button onClick={() => removePoll(poll.id)} disabled={polls.length === 1} className="p-2 text-red-500 hover:bg-red-100 rounded disabled:opacity-30 disabled:hover:bg-transparent">
                          <TrashIcon className="w-5 h-5 mx-auto" />
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Step 3. 종합 분석 결과 */}
            <div className="bg-white p-6 rounded-xl shadow-md border border-blue-200">
              <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center justify-between">
                <span>3. 종합 보정 결과 <span className="text-sm font-normal text-slate-500 ml-2">(총 응답자: {results.totalSample.toLocaleString()}명)</span></span>
              </h2>

              <div className="grid md:grid-cols-2 gap-6">
                {/* 단순 표본 가중 평균 (보정 전) */}
                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                  <h3 className="text-sm font-bold text-slate-500 mb-3 text-center">① 표본수(응답자) 비례 종합 지지율 (보정 전)</h3>
                  <div className="grid grid-cols-3 gap-2 text-center text-sm">
                    <div className="p-2 bg-white rounded border"><div className="text-blue-600 font-semibold text-xs">민주당</div><div className="font-bold">{results.aggregated.dp.toFixed(2)}%</div></div>
                    <div className="p-2 bg-white rounded border"><div className="text-red-600 font-semibold text-xs">국민의힘</div><div className="font-bold">{results.aggregated.ppp.toFixed(2)}%</div></div>
                    <div className="p-2 bg-white rounded border"><div className="text-slate-600 font-semibold text-xs">부동층</div><div className="font-bold">{results.aggregated.undecided.toFixed(2)}%</div></div>
                  </div>
                </div>

                {/* 가중치 배분 완료 (최종 결과) */}
                <div className="bg-blue-50 p-4 rounded-lg border border-blue-200 shadow-inner">
                  <h3 className="text-sm font-bold text-blue-800 mb-3 text-center">② 부동층 가중치({weightDP}:{weightPPP}) 분배 최종 결과</h3>
                  <div className="flex gap-4">
                    <div className="flex-1 bg-white p-3 rounded-lg border border-blue-300 text-center shadow-sm">
                      <div className="text-blue-700 font-bold mb-1">최종 민주당</div>
                      <div className="text-3xl font-black text-blue-600">{results.totalSample > 0 ? results.final.dp.toFixed(2) : '0.00'} <span className="text-lg">%</span></div>
                    </div>
                    <div className="flex-1 bg-white p-3 rounded-lg border border-red-300 text-center shadow-sm">
                      <div className="text-red-700 font-bold mb-1">최종 국민의힘</div>
                      <div className="text-3xl font-black text-red-600">{results.totalSample > 0 ? results.final.ppp.toFixed(2) : '0.00'} <span className="text-lg">%</span></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
